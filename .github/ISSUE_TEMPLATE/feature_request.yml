name: Feature request
description: Propose a user-observable improvement to DataSnoop.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests should describe the user outcome rather than a preferred implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what prevents them from completing their goal today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what a user should be able to do or understand.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional implementation ideas, constraints, alternatives, or examples.
  - type: dropdown
    id: capability
    attributes:
      label: Relevant capability
      options:
        - Telemetry ingestion
        - Go instrumentation
        - Request investigation
        - Host monitoring
        - Platform operations
        - Ecosystem
        - New capability
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and trade-offs
      description: Include user feedback, operational evidence, compatibility concerns, and potential risks.
